<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiker Map</title>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; background-color: #1a1a1a; }
        #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script>
        // Mapa con MapLibre GL (nativo del navegador) y teselas vectoriales de OpenFreeMap
        // (gratis, sin API key). Se mantiene EXACTAMENTE la misma interfaz window.* que
        // usaba la version anterior con Leaflet, para no tocar el codigo C#.
        var map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/liberty',
            center: [-3.7038, 40.4168], // [lng, lat] — OJO: MapLibre usa lng,lat
            zoom: 13,
            attributionControl: false
        });
        map.addControl(new maplibregl.NavigationControl(), 'top-right');

        // Si el usuario arrastra, dejamos de recentrar hasta que pulse "centrar".
        var followUser = true;
        map.on('dragstart', function () { followUser = false; });

        var meMarker = null;
        var routeCoords = [];   // en formato [lng, lat]
        var styleReady = false;

        // Trazado alternativo (gris, discontinuo): se usa al comparar la ruta grabada con la
        // ajustada al mapa antes de guardar. Va DEBAJO de 'route', que es la que se guardaria.
        var altCoords = [];

        function ensureRouteLayer() {
            if (map.getSource('route')) return;
            map.addSource('route_alt', {
                type: 'geojson',
                data: { type: 'Feature', geometry: { type: 'LineString', coordinates: altCoords } }
            });
            map.addLayer({
                id: 'route_alt', type: 'line', source: 'route_alt',
                layout: { 'line-join': 'round', 'line-cap': 'round' },
                paint: { 'line-color': '#9E9E9E', 'line-width': 4, 'line-opacity': 0.9, 'line-dasharray': [2, 2] }
            });
            map.addSource('route', {
                type: 'geojson',
                data: { type: 'Feature', geometry: { type: 'LineString', coordinates: routeCoords } }
            });
            map.addLayer({
                id: 'route', type: 'line', source: 'route',
                layout: { 'line-join': 'round', 'line-cap': 'round' },
                paint: { 'line-color': '#F44336', 'line-width': 4, 'line-opacity': 0.85 }
            });
        }

        map.on('load', function () { styleReady = true; ensureRouteLayer(); });

        // Ejecuta fn cuando el estilo este cargado (las fuentes/capas solo se pueden tocar
        // despues de 'load'); si aun no lo esta, lo encola.
        function whenReady(fn) { if (styleReady || map.loaded()) { styleReady = true; fn(); } else map.on('load', fn); }
        // Mover el mapa y pintar el punto de posicion no necesitan el estilo cargado: se hace al
        // momento. Si el estilo tarda (o no llega, sin red) el usuario ve su posicion igual.
        function rightNow(fn) { try { fn(); } catch (e) { whenReady(fn); } }

        function setRouteData() {
            if (map.getSource('route'))
                map.getSource('route').setData(
                    { type: 'Feature', geometry: { type: 'LineString', coordinates: routeCoords } });
        }

        // Marcador de posicion actual: punto VERDE con halo, para que se distinga a simple vista
        // del trazado rojo de la ruta. Antes era indigo sobre fondo de mapa y se perdia.
        //
        // Lo pintan LAS DOS entradas de posicion: updateLocation, que llega con cada punto GPS, y
        // centerOnLocation, que es la que corre al arrancar. Cuando solo lo hacia updateLocation,
        // con el dispositivo quieto no llegaban puntos nuevos y salia la posicion en la cabecera
        // pero ningun punto en el mapa: eso era «sale la posicion pero no el punto verde».
        function showMe(lat, lng) {
            var pos = [lng, lat];
            if (!meMarker) {
                var el = document.createElement('div');
                el.className = 'me-dot';
                el.style.cssText =
                    'width:18px;height:18px;border-radius:50%;background:#4CAF50;' +
                    'border:3px solid #ffffff;' +
                    'box-shadow:0 0 0 6px rgba(76,175,80,.30), 0 0 6px rgba(0,0,0,.6)';
                meMarker = new maplibregl.Marker({ element: el }).setLngLat(pos).addTo(map);
            } else {
                meMarker.setLngLat(pos);
            }
            return pos;
        }

        function updateLocation(lat, lng, accuracy) {
            rightNow(function () {
                var pos = showMe(lat, lng);
                if (followUser) map.easeTo({ center: pos, duration: 500 });
            });
        }

        function addRoutePoint(lat, lng) {
            whenReady(function () {
                routeCoords.push([lng, lat]);
                ensureRouteLayer();
                setRouteData();
            });
        }

        // Dibuja una ruta completa (GPX). Los puntos llegan como [lat, lng] desde C#.
        function drawRoute(coords) {
            whenReady(function () {
                routeCoords = (coords || []).map(function (c) { return [c[1], c[0]]; });
                ensureRouteLayer();
                setRouteData();
                if (routeCoords.length) {
                    followUser = false;
                    var b = new maplibregl.LngLatBounds(routeCoords[0], routeCoords[0]);
                    for (var i = 1; i < routeCoords.length; i++) b.extend(routeCoords[i]);
                    map.fitBounds(b, { padding: 40 });
                }
            });
        }

        function clearRoute() {
            whenReady(function () { routeCoords = []; setRouteData(); clearAltRoute(); });
        }

        function setAltRouteData() {
            if (map.getSource('route_alt'))
                map.getSource('route_alt').setData(
                    { type: 'Feature', geometry: { type: 'LineString', coordinates: altCoords } });
        }

        // Pinta el trazado alternativo en gris, sin mover el encuadre (lo fija drawRoute).
        function drawAltRoute(coords) {
            whenReady(function () {
                altCoords = (coords || []).map(function (c) { return [c[1], c[0]]; });
                ensureRouteLayer();
                setAltRouteData();
            });
        }

        function clearAltRoute() {
            whenReady(function () { altCoords = []; setAltRouteData(); });
        }

        function removeLastPoint() {
            whenReady(function () {
                if (!routeCoords.length) return;
                routeCoords.pop();
                setRouteData();
            });
        }

        function centerOnLocation(lat, lng, zoom) {
            rightNow(function () {
                followUser = true;
                showMe(lat, lng);   // al arrancar, esta es la unica que corre: tiene que pintar el punto
                map.easeTo({ center: [lng, lat], zoom: zoom || 15, duration: 600 });
            });
        }

        // Modo "Seguir": activa/desactiva el recentrado automatico en cada punto GPS.
        function setFollow(enabled) {
            followUser = !!enabled;
            whenReady(function () {
                if (followUser && meMarker)
                    map.easeTo({ center: meMarker.getLngLat(), duration: 500 });
            });
        }

        // Modo "Rumbo" (heading-up): rota el mapa para que la direccion del dispositivo
        // apunte hacia arriba. MapLibre soporta rotacion nativa (setBearing), sin CSS.
        // Arranca activado, igual que en AppShell/HomePage.
        var headingUp = true;
        function setHeadingUp(enabled) {
            headingUp = !!enabled;
            whenReady(function () {
                if (!headingUp) map.easeTo({ bearing: 0, duration: 300 });
            });
        }
        function setHeading(deg) {
            if (!headingUp) return;
            whenReady(function () { map.setBearing(deg); });
        }

        window.updateLocation = updateLocation;
        window.addRoutePoint = addRoutePoint;
        window.drawRoute = drawRoute;
        window.clearRoute = clearRoute;
        window.drawAltRoute = drawAltRoute;
        window.clearAltRoute = clearAltRoute;
        window.removeLastPoint = removeLastPoint;
        window.centerOnLocation = centerOnLocation;
        window.setFollow = setFollow;
        window.setHeadingUp = setHeadingUp;
        window.setHeading = setHeading;
        window.mapReady = true;
    </script>
</body>
</html>
